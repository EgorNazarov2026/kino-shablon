<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Movie Template</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Movie Template" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay" class="overlay"></div>

  <div id="film-modal-overlay" class="overlay" hidden></div>
  <div id="film-modal" class="modal" hidden aria-hidden="true">
    <h3 class="modal-title">New Movie</h3>

    <label class="field-label" for="film-title-input">Title</label>
    <input
      id="film-title-input"
      class="text-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="sentences"
      spellcheck="false"
    />

    <label class="field-label" for="film-date-input">Date</label>
    <input id="film-date-input" class="text-input" type="date" />

    <div class="button-row">
      <button id="film-save-btn" class="btn btn-primary" type="button">Save</button>
      <button id="film-cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
    </div>
  </div>

  <nav id="side-menu" class="side-menu" aria-hidden="true">
    <div class="side-menu-header">Menu</div>
    <ul class="side-menu-list">
      <li><button class="side-menu-item" type="button" data-page="home">Home</button></li>
      <li><button class="side-menu-item" type="button" data-page="films">Movies</button></li>
      <li><button class="side-menu-item" type="button" data-page="new">New</button></li>
      <li><button class="side-menu-item" type="button" data-page="oscar">For Oscar</button></li>
      <li><button class="side-menu-item" type="button" data-page="classic">Classics</button></li>
      <li><button class="side-menu-item" type="button" data-page="series">TV Shows</button></li>
    </ul>
  </nav>

  <div class="screen">
    <header class="header">
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <h1 id="app-title" class="app-title">Home</h1>
    </header>

    <main class="main">
      <section id="page-home" class="page" data-title="Home">
        <label class="field-label" for="title-input">Movie Title</label>
        <input
          id="title-input"
          class="text-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="sentences"
          spellcheck="false"
          placeholder="e.g. Anora"
        />
        <p id="error-msg" class="error-msg" hidden>Enter a movie title</p>

        <button id="generate-btn" class="btn btn-primary" type="button">
          GENERATE TEMPLATE
        </button>

        <section id="result-section" class="result-section" hidden>
          <label class="field-label" for="result-area">Generated Template</label>
          <textarea
            id="result-area"
            class="result-area"
            spellcheck="false"
          ></textarea>

          <div class="button-row">
            <button id="copy-btn" class="btn btn-secondary" type="button">
              COPY
            </button>
            <button id="share-btn" class="btn btn-secondary" type="button" hidden>
              SHARE
            </button>
          </div>
        </section>
      </section>

      <section id="page-films" class="page" hidden data-title="Movies">
        <div class="page-films-header">
          <h2 class="page-title">Movies</h2>
          <button id="add-film-btn" class="icon-btn" type="button" aria-label="Add movie">+</button>
        </div>

        <ul id="films-list" class="films-list"></ul>
        <p id="films-empty" class="page-placeholder">No movies yet.</p>
      </section>

      <section id="page-film-card" class="page" hidden data-title="Movie">
        <button id="film-card-back-btn" class="icon-btn" type="button" aria-label="Back to list">‹</button>

        <h2 id="film-card-title" class="film-card-title"></h2>
        <p id="film-card-date-display" class="film-card-date-display"></p>

        <div class="film-card-actions">
          <button id="film-card-date-btn" class="btn btn-secondary" type="button">Date</button>
          <button id="film-card-links-btn" class="btn btn-secondary" type="button" disabled>Links</button>
          <button id="film-card-info-btn" class="btn btn-secondary" type="button" disabled>Info</button>
          <button id="film-card-delete-btn" class="btn btn-secondary film-card-delete" type="button">Delete</button>
        </div>

        <div id="film-card-date-editor" class="film-card-date-editor" hidden>
          <label class="field-label" for="film-card-date-input">Date</label>
          <input id="film-card-date-input" class="text-input" type="date" />
          <div class="button-row">
            <button id="film-card-date-save-btn" class="btn btn-primary" type="button">Save</button>
            <button id="film-card-date-cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
          </div>
        </div>
      </section>

      <section id="page-new" class="page" hidden data-title="New">
        <h2 class="page-title">New</h2>
        <p class="page-placeholder">Content coming soon.</p>
      </section>

      <section id="page-oscar" class="page" hidden data-title="For Oscar">
        <h2 class="page-title">For Oscar</h2>
        <p class="page-placeholder">Content coming soon.</p>
      </section>

      <section id="page-classic" class="page" hidden data-title="Classics">
        <h2 class="page-title">Classics</h2>
        <p class="page-placeholder">Content coming soon.</p>
      </section>

      <section id="page-series" class="page" hidden data-title="TV Shows">
        <h2 class="page-title">TV Shows</h2>
        <p class="page-placeholder">Content coming soon.</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
