<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>КИНО ШАБЛОН</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111113" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Кино Шаблон" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay" class="overlay"></div>

  <nav id="side-menu" class="side-menu" aria-hidden="true">
    <div class="side-menu-header">Меню</div>
    <ul class="side-menu-list">
      <li><button class="side-menu-item" type="button" data-page="home">Дом</button></li>
      <li><button class="side-menu-item" type="button" data-page="films">Фильмы</button></li>
      <li><button class="side-menu-item" type="button" data-page="new">Новинки</button></li>
      <li><button class="side-menu-item" type="button" data-page="oscar">На Оскар</button></li>
      <li><button class="side-menu-item" type="button" data-page="classic">Классика</button></li>
      <li><button class="side-menu-item" type="button" data-page="series">Сериалы</button></li>
    </ul>
  </nav>

  <div class="screen">
    <header class="header">
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
      <h1 class="app-title">КИНО ШАБЛОН</h1>
    </header>

    <main class="main">
      <section id="page-home" class="page">
        <label class="field-label" for="title-input">Название фильма</label>
        <input
          id="title-input"
          class="text-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="sentences"
          spellcheck="false"
          placeholder="Например, Anora"
        />
        <p id="error-msg" class="error-msg" hidden>Введите название фильма</p>

        <button id="generate-btn" class="btn btn-primary" type="button">
          СОЗДАТЬ ШАБЛОН
        </button>

        <section id="result-section" class="result-section" hidden>
          <label class="field-label" for="result-area">Готовый шаблон</label>
          <textarea
            id="result-area"
            class="result-area"
            spellcheck="false"
          ></textarea>

          <div class="button-row">
            <button id="copy-btn" class="btn btn-secondary" type="button">
              КОПИРОВАТЬ
            </button>
            <button id="share-btn" class="btn btn-secondary" type="button" hidden>
              ПОДЕЛИТЬСЯ
            </button>
          </div>
        </section>
      </section>

      <section id="page-films" class="page" hidden>
        <div class="page-films-header">
          <h2 class="page-title">Фильмы</h2>
          <button id="add-film-btn" class="icon-btn" type="button" aria-label="Добавить фильм">+</button>
        </div>

        <div id="film-form" class="film-form" hidden>
          <label class="field-label" for="film-title-input">Название фильма</label>
          <input
            id="film-title-input"
            class="text-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="sentences"
            spellcheck="false"
            placeholder="Название фильма"
          />

          <label class="field-label" for="film-date-input">Дата премьеры</label>
          <input id="film-date-input" class="text-input" type="date" />

          <div class="button-row">
            <button id="film-save-btn" class="btn btn-primary" type="button">Сохранить</button>
            <button id="film-cancel-btn" class="btn btn-secondary" type="button">Отмена</button>
          </div>
        </div>

        <ul id="films-list" class="films-list"></ul>
        <p id="films-empty" class="page-placeholder">Список фильмов пуст.</p>
      </section>

      <section id="page-new" class="page" hidden>
        <h2 class="page-title">Новинки</h2>
        <p class="page-placeholder">Здесь скоро появится содержимое.</p>
      </section>

      <section id="page-oscar" class="page" hidden>
        <h2 class="page-title">На Оскар</h2>
        <p class="page-placeholder">Здесь скоро появится содержимое.</p>
      </section>

      <section id="page-classic" class="page" hidden>
        <h2 class="page-title">Классика</h2>
        <p class="page-placeholder">Здесь скоро появится содержимое.</p>
      </section>

      <section id="page-series" class="page" hidden>
        <h2 class="page-title">Сериалы</h2>
        <p class="page-placeholder">Здесь скоро появится содержимое.</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
